name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:


permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Build Output
        run: npm run verify

      - name: Run Tests
        run: npm test

            - name: Create Package Tarball
        run: |
          npm pack
          echo "Tarballs generated:"
          ls -lah *.tgz

      - name: Create GitHub Release + Upload .tgz
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: "*.tgz"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

