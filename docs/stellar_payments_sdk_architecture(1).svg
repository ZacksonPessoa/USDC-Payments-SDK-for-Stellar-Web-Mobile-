<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700">
  <defs>
    <style type="text/css"><![CDATA[
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: bold; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #444; }
      .box { fill: #F8FAFF; stroke: #2D5BFF; stroke-width: 2; rx: 14; ry: 14; }
      .box-optional { fill: #F9FFF8; stroke: #26A269; stroke-width: 2; rx: 14; ry: 14; stroke-dasharray: 6 6; }
      .box-horizon { fill: #FFF8F8; stroke: #E73C3C; stroke-width: 2; rx: 14; ry: 14; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #333; }
      .arrow { stroke: #111; stroke-width: 2; marker-end: url(#arrowhead); }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #666; font-style: italic; }
      .kpi { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #222; }
    ]]></style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" class="title" text-anchor="middle">USDC Payments SDK for Stellar – Architecture</text>
  <text x="600" y="78" class="subtitle" text-anchor="middle">Checkout UI + Tx Builder + Webhooks + SEP-24 helper</text>

  <!-- Merchant App -->
  <rect x="70" y="140" width="300" height="120" class="box"/>
  <text x="220" y="175" class="label" text-anchor="middle">Merchant App</text>
  <text x="220" y="200" class="small" text-anchor="middle">(Web / Mobile)</text>
  <text x="220" y="225" class="small" text-anchor="middle">Storefront, Cart, Order API</text>

  <!-- Payments SDK -->
  <rect x="450" y="120" width="320" height="200" class="box"/>
  <text x="610" y="155" class="label" text-anchor="middle">Payments SDK</text>
  <text x="610" y="178" class="small" text-anchor="middle">• Checkout Component (UI)</text>
  <text x="610" y="198" class="small" text-anchor="middle">• Tx Builder & Submit (Horizon)</text>
  <text x="610" y="218" class="small" text-anchor="middle">• Config: Network, Issuer, Memo</text>
  <text x="610" y="238" class="small" text-anchor="middle">• Wallet adapters (Freighter) *</text>
  <text x="610" y="258" class="note" text-anchor="middle">* Wallet adapters/Sign: added in hardening</text>

  <!-- Horizon -->
  <rect x="840" y="140" width="300" height="120" class="box-horizon"/>
  <text x="990" y="175" class="label" text-anchor="middle">Stellar Horizon</text>
  <text x="990" y="200" class="small" text-anchor="middle">(Testnet / Mainnet)</text>
  <text x="990" y="225" class="small" text-anchor="middle">Submit Tx • Fetch Status • Events</text>

  <!-- On/Off-ramp -->
  <rect x="450" y="370" width="320" height="160" class="box-optional"/>
  <text x="610" y="405" class="label" text-anchor="middle">On/Off-ramp (SEP-24)</text>
  <text x="610" y="430" class="small" text-anchor="middle">Optional deposit/withdraw flows</text>
  <text x="610" y="452" class="small" text-anchor="middle">Provider adapters (config-driven)</text>
  <text x="610" y="474" class="small" text-anchor="middle">KYC/KYB hooks as needed</text>

  <!-- Merchant Backend -->
  <rect x="70" y="360" width="300" height="180" class="box"/>
  <text x="220" y="395" class="label" text-anchor="middle">Merchant Backend</text>
  <text x="220" y="420" class="small" text-anchor="middle">Webhooks: payment.confirmed / failed</text>
  <text x="220" y="442" class="small" text-anchor="middle">Order fulfillment • Receipts</text>
  <text x="220" y="464" class="small" text-anchor="middle">Reconciliation & Audit logs</text>
  <text x="220" y="486" class="note" text-anchor="middle">Webhooks arrive in Phase 2</text>

  <!-- Arrows -->
  <line x1="370" y1="200" x2="450" y2="200" class="arrow" />
  <text x="410" y="190" class="kpi" text-anchor="middle">Checkout call</text>

  <line x1="770" y1="200" x2="840" y2="200" class="arrow" />
  <text x="805" y="190" class="kpi" text-anchor="middle">submitTransaction()</text>

  <line x1="990" y1="260" x2="610" y2="320" class="arrow" />
  <text x="800" y="305" class="kpi" text-anchor="middle">Tx result / events</text>

  <line x1="610" y1="320" x2="220" y2="320" class="arrow" />
  <text x="410" y="310" class="kpi" text-anchor="middle">onSuccess(txHash) / onError()</text>

  <line x1="390" y1="450" x2="450" y2="450" class="arrow" />
  <text x="420" y="438" class="kpi" text-anchor="middle">SEP-24 flow</text>

  <!-- Labels -->
  <text x="610" y="290" class="subtitle" text-anchor="middle">Phase 1: Core SDK (Web)</text>
  <text x="220" y="550" class="subtitle" text-anchor="middle">Phase 2: Webhooks</text>
  <text x="610" y="550" class="subtitle" text-anchor="middle">Phase 2: SEP-24 helper</text>

  <!-- Legend -->
  <rect x="860" y="360" width="280" height="150" class="box"/>
  <text x="1000" y="385" class="label" text-anchor="middle">Legend</text>
  <circle cx="880" cy="410" r="6" fill="#2D5BFF"/>
  <text x="900" y="416" class="small">Core SDK (Phase 1)</text>
  <rect x="870" y="430" width="16" height="16" class="box-horizon" />
  <text x="900" y="442" class="small">Stellar Horizon</text>
  <rect x="870" y="454" width="16" height="16" class="box-optional" />
  <text x="900" y="466" class="small">Optional (Phase 2)</text>
  <text x="1000" y="490" class="note" text-anchor="middle">Arrows show primary data flow</text>
</svg>
